<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Surprise 💗</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* BASE */
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      overflow-x: hidden;
    }

    /* ANIMATION */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 120, 180, .25), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(180, 120, 255, .25), transparent 45%);
      animation: bgMove 18s linear infinite;
      z-index: -3;
    }

    @keyframes bgMove {
      0% {
        transform: rotate(0deg)
      }

      100% {
        transform: rotate(360deg)
      }
    }

    /* VIDEO */
    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -2;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: -1;
    }

    /* SECTION */
    .section {
      min-height: 100svh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .fade-in {
      animation: fadeIn 1.6s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* INTRO */
    .quote-box {
      background: rgba(30, 0, 10, .75);
      padding: 2rem;
      border-radius: 22px;
      max-width: 620px;
      box-shadow: 0 0 40px rgba(255, 120, 180, .35);
    }

    .quote {
      color: white;
      font-size: 1.5rem;
      font-style: italic;
    }

    .byline {
      color: #ddd;
      margin-top: 1rem
    }

    /* FUTURE */
    .future {
      display: none
    }

    /* HEARTBEAT TITLE */
    .hbd {
      font-size: 3rem;
      font-weight: 800;
      color: #ff8ec7;
      text-shadow: 0 0 18px rgba(255, 140, 200, .9);
      animation: heartbeat 2s infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1)
      }

      14% {
        transform: scale(1.08)
      }

      28% {
        transform: scale(1)
      }
    }

    /* TYPEWRITER */
    .typewriter {
      color: #eee;
      max-width: 650px;
      margin: 1rem auto;
    }

    .cursor::after {
      content: "|";
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    /* GRID */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .8rem;
      max-width: 900px;
      margin: 2rem auto;
    }

    .photo-grid img {
      height: 160px;
      object-fit: cover;
      border-radius: 18px;
      cursor: pointer;
      transition: .4s;
      box-shadow: 0 10px 25px rgba(255, 120, 180, .25);
    }

    .photo-grid img:hover {
      transform: scale(1.08) rotate(1deg);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .95);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 20px
    }

    .lightbox span {
      position: absolute;
      color: white;
      font-size: 2.2rem;
      cursor: pointer;
    }

    .close {
      top: 20px;
      right: 20px
    }

    .prev {
      left: 15px;
      top: 50%
    }

    .next {
      right: 15px;
      top: 50%
    }

    #caption {
      color: #ff9ed6;
      margin-top: 1rem;
      font-weight: 600
    }

    /* CANDLE */
    #flame {
      width: 22px;
      height: 42px;
      background: radial-gradient(circle, #ffdd44 40%, transparent 80%);
      border-radius: 50%;
      margin: -40px auto 0;
      animation: flicker 1s infinite alternate;
    }

    @keyframes flicker {
      from {
        transform: scale(1)
      }

      to {
        transform: scale(1.15)
      }
    }

    /* FLOATING LOVE */
    .love {
      position: fixed;
      bottom: -20px;
      animation: floatLove linear forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes floatLove {
      from {
        transform: translateY(0) scale(1);
        opacity: 1
      }

      to {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0
      }
    }


    .spark {
      position: fixed;
      font-size: 10px;
      color: #fff;
      animation: spark 1.5s linear forwards;
    }

    @keyframes spark {
      from {
        opacity: 1;
        transform: translateY(0)
      }

      to {
        opacity: 0;
        transform: translateY(-80px)
      }
    }

    /* AUDIO */
    .audio-player {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .6);
      padding: 8px 14px;
      border-radius: 30px;
    }

    /* RESPONSIVE */
    @media(max-width:768px) {
      .hbd {
        font-size: 2.2rem
      }

      .quote {
        font-size: 1.2rem
      }
    }
  </style>
</head>

<body>

  <!-- VIDEO -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="VIDIO1.mp4">
  </video>
  <div class="video-overlay"></div>

  <!-- INTRO -->
  <section class="section fade-in" id="intro">
    <div class="quote-box">
      <div class="quote" id="quoteText"></div>
      <div class="byline">— Zahra Nur Azizah 🎉</div>
    </div>
    <button id="startBtn"
      class="mt-6 bg-gradient-to-r from-pink-500 to-red-500 px-8 py-3 rounded-xl text-white font-bold">
      Click Me 💖
    </button>
  </section>

  <!-- FUTURE -->
  <section class="section future" id="future">
    <div style="width:50px;height:100px;background:#ffd966;border-radius:15px;"></div>
    <div id="flame"></div>

    <div class="hbd mt-6">ZARA 💗</div>
    <div class="typewriter cursor" id="typeText"></div>

    <div class="photo-grid" id="gallery">
      <img src="zara.jpeg">
      <img src="zara2.jpeg">
      <img src="zara3.jpeg">
      <img src="zara4.jpeg">
      <img src="zara5.jpeg">
      <img src="zara6.jpeg">
      <img src="zara7.jpeg">
      <img src="zara8.jpeg">
    </div>

    <button onclick="location.reload()"
      class="bg-gradient-to-r from-pink-400 to-purple-400 px-8 py-3 rounded-xl font-bold">
      Replay 🔁
    </button>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="lightbox.style.display='none'">✖</span>
    <span class="prev" onclick="changeSlide(-1)">❮</span>
    <img id="lightboxImg">
    <div id="caption"></div>
    <span class="next" onclick="changeSlide(1)">❯</span>
  </div>

  <!-- AUDIO -->
  <div class="audio-player">
    <button id="playBtn">▶️</button>
    <audio id="music" loop>
      <source src="HBD.mp3">
    </audio>
  </div>

  <script>
    /* QUOTE */
    const quotes = [
      "Your smile makes every moment brighter.",
      "Another year, another beautiful chapter.",
      "You deserve all the happiness today.",
      "HAPPY BIRTHDAY SAYANG 💗"
    ];
    quoteText.innerText = quotes[Math.floor(Math.random() * quotes.length)];

    /* TYPEWRITER */
    const msg = "Semoga panjang umur, sehat, semua doa kamu dikabulkan, dan selalu bahagia ya 💖";
    let i = 0;
    function typeWriter() {
      if (i < msg.length) {
        typeText.innerHTML += msg.charAt(i++);
        setTimeout(typeWriter, 45);
      }
    }

    /* LOVE + SPARKLE */
    function startRomantic() {
      setInterval(() => {
        const love = document.createElement("div");
        love.className = "love";
        love.innerHTML = Math.random() > 0.5 ? "💗" : "💖";
        love.style.left = Math.random() * 100 + "vw";
        love.style.fontSize = Math.random() * 18 + 16 + "px";
        love.style.animationDuration = Math.random() * 3 + 4 + "s";
        document.body.appendChild(love);
        setTimeout(() => love.remove(), 7000);
      }, 700);

      setInterval(() => {
        const s = document.createElement("div");
        s.className = "spark";
        s.innerHTML = "✨";
        s.style.left = Math.random() * 100 + "vw";
        s.style.bottom = "0";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }, 500);
    }

    /* START */
    startBtn.onclick = () => {
      intro.style.display = "none";
      future.style.display = "flex";
      future.classList.add("fade-in");
      music.volume = 0;
      music.play();
      let v = 0;
      const fade = setInterval(() => { if (v < 1) { v += 0.02; music.volume = v } else clearInterval(fade) }, 120);
      playBtn.innerText = "⏸️";
      typeWriter();
      startRomantic();
    };

    /* AUDIO */
    playBtn.onclick = () => {
      if (music.paused) { music.play(); playBtn.innerText = "⏸️" }
      else { music.pause(); playBtn.innerText = "▶️" }
    };

    /* LIGHTBOX */
    const imgs = [...document.querySelectorAll("#gallery img")];
    const captions = [
      "Kamu selalu bikin hari jadi indah 💗",
      "Senyum kamu itu candu",
      "Aku bersyukur kenal kamu",
      "Terima kasih sudah ada",
      "Hari ini milik kamu 💖",
      "Semoga bahagia terus ya",
      "Cantik luar dalam",
      "Love you always 💞"
    ];
    let index = 0;
    imgs.forEach((img, i) => {
      img.onclick = () => {
        index = i;
        lightbox.style.display = "flex";
        lightboxImg.src = imgs[index].src;
        caption.innerText = captions[index];
      }
    });
    function changeSlide(n) {
      index = (index + n + imgs.length) % imgs.length;
      lightboxImg.src = imgs[index].src;
      caption.innerText = captions[index];
    }
  </script>

</body>

</html>
